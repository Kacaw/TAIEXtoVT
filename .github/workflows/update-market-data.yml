name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    # 08:30 and 17:30 Asia/Taipei. Weekend runs are harmless and keep the
    # schedule active even when exchanges are closed.
    - cron: "30 0 * * *"
    - cron: "30 9 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build latest market data
        run: python scripts/build_market_data.py

      - name: Verify core data freshness
        run: python scripts/check_market_data.py

      - name: Commit refreshed CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          if git diff --cached --quiet; then
            echo "No market data changes"
            exit 0
          fi
          git commit -m "chore: refresh market data"
          git push

      - name: Keep scheduled workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update-market-data.yml/enable"
